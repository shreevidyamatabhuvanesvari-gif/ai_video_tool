<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<title>AI Video Tool</title>

<style>

body{
font-family:Arial, sans-serif;
background:#f2f4f8;
text-align:center;
margin:0;
padding:0;
}

header{
background:#1e88e5;
color:white;
padding:20px;
font-size:24px;
}

.container{
margin-top:40px;
background:white;
width:400px;
margin-left:auto;
margin-right:auto;
padding:30px;
border-radius:10px;
box-shadow:0 4px 15px rgba(0,0,0,0.2);
}

button{
width:200px;
padding:12px;
margin:10px;
border:none;
border-radius:5px;
background:#1e88e5;
color:white;
font-size:16px;
cursor:pointer;
}

button:hover{
background:#1565c0;
}

input[type=file]{
margin:15px;
}

.status{
margin-top:20px;
font-weight:bold;
color:#333;
}

footer{
margin-top:40px;
font-size:12px;
color:#777;
}

</style>

</head>

<body>

<header>

AI Video Tool

</header>

<div class="container">

<h3>Upload Video</h3>

<input type="file" id="videoFile">

<br>

<button onclick="uploadVideo()">Upload Video</button>

<br>

<button onclick="processVideo()">Process Video</button>

<br>

<button onclick="downloadTranscript()">Download Transcript</button>

<br>

<button onclick="downloadSubtitle()">Download Subtitle</button>

<div class="status" id="status">

Status: Waiting for upload

</div>

</div>

<footer>

Termux AI Video Processing System

</footer>

<script>

function uploadVideo(){
document.getElementById("status").innerText="Uploading video...";
}

function processVideo(){
document.getElementById("status").innerText="Processing video...";
}

function downloadTranscript(){
document.getElementById("status").innerText="Downloading transcript...";
}

function downloadSubtitle(){
document.getElementById("status").innerText="Downloading subtitle...";
}

</script>

</body>
</html>
